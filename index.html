<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant Finder</title>
<meta name="description" content="Ask a question in plain English and get matching federal grant opportunities, eligibility tips, and deadlines.">
<meta property="og:title" content="Grant Finder">
<meta property="og:description" content="Ask a question in plain English and get matching federal grant opportunities, eligibility tips, and deadlines.">
<meta property="og:type" content="website">
<style>
  :root{--accent:#d97757;--accent2:#c2613f;--ink:#1f1e1d;--ink2:#2a2825;--muted:#6b6862;--line:#e8e4d9;--bg:#faf9f5;--card:#fff;--good:#16a34a;--bad:#e5484d;--warn:#b8852a;--radius:16px;--shadow:0 8px 30px rgba(40,33,24,.06);--serif:ui-serif,'Iowan Old Style',Georgia,'Times New Roman',serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  /* Claude-style serif display headings — calm, simple, distinctive */
  h1.hero-h,.sec-head h2{font-family:var(--serif);font-weight:600;letter-spacing:-.5px}

  /* ===== SITE STYLES ===== */
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  a{color:inherit;text-decoration:none}

  section.blk{padding:56px 0;position:relative}
  .hero{text-align:center;padding:64px 0 56px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(60% 50% at 50% 0%, color-mix(in srgb,var(--accent) 20%,transparent), transparent 70%),radial-gradient(40% 40% at 85% 15%, color-mix(in srgb,var(--accent2) 22%,transparent), transparent 70%)}
  .hero .wrap{position:relative;z-index:1}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);margin-bottom:20px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  h1.hero-h{font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-1.4px;font-weight:800;margin:0 0 14px}
  .hero-sub{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto 30px}
  .searchwrap{max-width:700px;margin:0 auto}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 9px 9px 18px;box-shadow:0 16px 50px rgba(20,40,80,.13)}
  .searchbox:focus-within{border-color:var(--accent)}
  .searchbox .ai-ic{font-size:20px}
  .searchbox input{flex:1;border:none;outline:none;font-size:16px;background:transparent;padding:8px 0}
  .searchbox button{background:var(--accent);color:#fff;border:none;border-radius:13px;padding:12px 20px;font-weight:800;font-size:15px;cursor:pointer}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}
  .results{max-width:700px;margin:16px auto 0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:none}
  .results.show{display:block}
  .results .rhead{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
  .claude-badge{font-size:10.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:1px 7px;margin-left:auto;font-weight:700}

  .sec-head{text-align:center;max-width:620px;margin:0 auto 34px}
  .sec-head .ey{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}
  .sec-head h2{font-size:clamp(25px,4vw,36px);letter-spacing:-1px;margin:9px 0 8px}
  .sec-head p{color:var(--muted);font-size:16px;margin:0}

  .pmodal-ov{position:fixed;inset:0;background:rgba(8,16,28,.5);z-index:80;display:none}
  .pmodal-ov.show{display:block}
  .pmodal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(10,30,60,.3);padding:28px;display:none}
  .pmodal.show{display:block}
  .pmodal h3{margin:0 0 12px}
  .pmodal p{color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-wrap;margin:0}
  .pmodal .pclose{margin-top:16px;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
  footer.site a{text-decoration:underline}
  footer.site{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:13.5px;text-align:center}

  /* ===== AGENCY LOGO MARQUEE (Netlify-style scroll) ===== */
  .logos-blk{padding:46px 0}
  .logos{overflow:hidden;position:relative;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .logos-track{display:flex;gap:34px;width:max-content;animation:logoscroll 40s linear infinite}
  .logos:hover .logos-track{animation-play-state:paused}
  .logo-item{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding:11px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .logo-seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;flex:0 0 auto;background:var(--accent)}
  .logo-name{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
  @keyframes logoscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(prefers-reduced-motion:reduce){.logos-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}

  /* ===== AI GRANT RESULT CARDS ===== */
  .grant-intro{margin:0 0 12px;color:var(--muted);font-size:13.5px}
  .grant-list{display:flex;flex-direction:column;gap:12px}
  .grant-card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;background:var(--bg)}
  .grant-card .gtitle{font-weight:800;font-size:15px;color:var(--ink);margin:0 0 8px;line-height:1.4}
  .grant-card .grow{font-size:13px;color:var(--ink);margin:3px 0;display:flex;gap:8px;align-items:baseline}
  .grant-card .glabel{color:var(--muted);font-weight:700;min-width:84px;flex:0 0 auto}
  .grant-card a{color:var(--accent);font-weight:700;text-decoration:underline}
</style>
</head>
<body>

<!-- ===== SITE ===== -->
<main id="canvas"></main>
<footer class="site"><div class="wrap"><span id="footName">Grant Finder</span> · AI grant search <b style="color:var(--ink)">powered by Claude</b> · <a href="#" onclick="showPrivacy();return false">Privacy</a></div></footer>

<!-- Privacy modal -->
<div class="pmodal-ov" id="privOverlay" onclick="hidePrivacy()"></div>
<div class="pmodal" id="privModal"><h3>Privacy</h3><p id="privBody"></p><button class="pclose" onclick="hidePrivacy()">Close</button></div>

<script>
/* ===================== MODEL ===================== */
const SITE = {
  name:'Grant Finder', accent:'#d97757', accent2:'#c2613f',
  privacy:'We respect your privacy. Questions you send through our grant search are used only to answer you and improve our service — they are not sold. Our search is powered by Claude (Anthropic), which processes your questions to generate replies. Contact us anytime to request deletion of your information.',
  agent:{system:''},
  search:{placeholder:'Ask about federal grants — eligibility, deadlines, how to apply…', examples:[
    'I\'ve never applied for a federal grant — where do I start?',
    'How do I register on SAM.gov and Grants.gov?',
    'What is a UEI number and do I need one?',
    'Which grants is my small business eligible for?',
    'What\'s the difference between SBIR and STTR?',
    'Which agencies fund first-time applicants?',
    'What documents do I need before I apply?',
    'Show me grants closing in the next 90 days',
    'How long does the application process take?',
    'Are there grants that don\'t require matching funds?']},
  blocks:[
    {type:'hero', pill:'AI-powered', headline:'Find federal grants, fast.', sub:'Ask a question in plain English and get matching opportunities, eligibility tips, and deadlines.'},
    {type:'agencies', ey:'Trusted sources', title:'We track grants from every major federal agency', sub:'Open funding opportunities, pulled together from the agencies that matter to you.',
      items:[{short:'NIH',name:'National Institutes of Health',color:'#20558a'},
             {short:'NSF',name:'National Science Foundation',color:'#1a7a8c'},
             {short:'DOE',name:'Department of Energy',color:'#0a6b3b'},
             {short:'USDA',name:'U.S. Dept. of Agriculture',color:'#5a7d2a'},
             {short:'DOD',name:'Department of Defense',color:'#2f4858'},
             {short:'NASA',name:'NASA',color:'#0b3d91'},
             {short:'ED',name:'Department of Education',color:'#7a3b8c'},
             {short:'SBA',name:'Small Business Administration',color:'#1f6feb'},
             {short:'EPA',name:'Environmental Protection Agency',color:'#13795b'},
             {short:'HHS',name:'Health & Human Services',color:'#205493'}]}
  ]
};

const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===================== RENDER BLOCKS ===================== */
function renderHero(b){ return `<section class="blk hero"><div class="wrap">
  <span class="pill"><span class="dot"></span>${esc(b.pill)}</span>
  <h1 class="hero-h">${esc(b.headline)}</h1><p class="hero-sub">${esc(b.sub)}</p>
  <div class="searchwrap"><div class="searchbox"><span class="ai-ic">✨</span>
    <input type="text" id="aiSearch" placeholder="${esc(SITE.search.placeholder)}" onkeydown="if(event.key==='Enter')runSearch()"><button onclick="runSearch()">Search</button></div>
    <div class="chips">${SITE.search.examples.map(x=>`<span class="chip" onclick="fillSearch('${esc(x).replace(/'/g,"&#39;")}')">${esc(x)}</span>`).join('')}</div>
    <div class="results" id="searchResults"><div class="rhead">✨ AI answer <span class="claude-badge">Powered by Claude</span></div><div id="searchAns"></div></div>
  </div></div></section>`; }
function logoItem(a,hidden){ const col=a.color||'var(--accent)';
  return `<div class="logo-item"${hidden?' aria-hidden="true"':''}><span class="logo-seal" style="background:${col}">${esc(a.short||'')}</span><span class="logo-name">${esc(a.name||'')}</span></div>`; }
function renderAgencies(b){
  const live=b.items.map(a=>logoItem(a,false)).join('');
  const dup=b.items.map(a=>logoItem(a,true)).join('');
  return `<section class="blk logos-blk" style="background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)"><div class="wrap">
  <div class="sec-head"><div class="ey">${esc(b.ey)}</div><h2>${esc(b.title)}</h2><p>${esc(b.sub)}</p></div>
  </div>
  <div class="logos"><div class="logos-track">${live}${dup}</div></div></section>`; }
const RENDER={hero:renderHero,agencies:renderAgencies};

function render(){
  document.documentElement.style.setProperty('--accent',SITE.accent);
  document.documentElement.style.setProperty('--accent2',SITE.accent2);
  $('footName').textContent=SITE.name;
  $('canvas').innerHTML = SITE.blocks.map(b=>(RENDER[b.type]||(()=>''))(b)).join('');
}

/* ===================== AI GRANT SEARCH ===================== */
async function callAI(prompt){
  // Calls Claude via the Netlify Function (/.netlify/functions/claude). Works once deployed with ANTHROPIC_API_KEY set.
  try{
    const r=await fetch('/.netlify/functions/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,system:SITE.agent.system||''})});
    if(!r.ok) throw 0;
    const d=await r.json();
    return d.answer||'';
  }catch(e){
    await new Promise(r=>setTimeout(r,500));
    return 'Demo mode — Claude answers here once this site is deployed to Netlify with your API key. You asked: "'+prompt+'"';
  }
}
/* Formats an AI answer. Numbered entries (grants) become separated cards; everything else
   renders as light markdown (bold, links). */
function fmtAI(t){
  t=(t||'').trim(); if(!t) return '';
  function inline(s){ s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s; }
  var lines=t.split(/\r?\n/), entries=[], cur=null, intro=[];
  for(var k=0;k<lines.length;k++){ var ln=lines[k];
    var m=ln.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if(m){ if(cur) entries.push(cur); cur={title:m[2],rows:[]}; }
    else if(cur){ var b=ln.match(/^\s*[-*•]\s+(.*)$/); if(b) cur.rows.push(b[1]); else if(ln.trim()) cur.rows.push(ln.trim()); }
    else if(ln.trim()) intro.push(ln.trim()); }
  if(cur) entries.push(cur);
  if(!entries.length) return '<div>'+lines.map(function(l){return l.trim()?inline(l):'';}).join('<br>')+'</div>';
  var html='';
  if(intro.length) html+='<p class="grant-intro">'+inline(intro.join(' '))+'</p>';
  html+='<div class="grant-list">';
  for(var e=0;e<entries.length;e++){ var en=entries[e];
    html+='<div class="grant-card"><div class="gtitle">'+inline(en.title)+'</div>';
    for(var ri=0;ri<en.rows.length;ri++){ var row=en.rows[ri];
      var lm=row.match(/^\*{0,2}([^:*\/\[\]()]{2,40}?)\*{0,2}:\s+(.+)$/);
      if(lm) html+='<div class="grow"><span class="glabel">'+inline(lm[1])+'</span><span>'+inline(lm[2])+'</span></div>';
      else html+='<div class="grow"><span>'+inline(row)+'</span></div>'; }
    html+='</div>'; }
  html+='</div>'; return html;
}
function fillSearch(t){ const s=$('aiSearch'); if(s){ s.value=t; runSearch(); } }
async function runSearch(){ const s=$('aiSearch'); if(!s) return; const q=s.value.trim(); if(!q) return; const box=$('searchResults'); box.classList.add('show'); $('searchAns').innerHTML='<span style="opacity:.6">✨ thinking…</span>'; $('searchAns').innerHTML=fmtAI(await callAI(q)); }

/* ===================== PRIVACY ===================== */
function showPrivacy(){ $('privBody').textContent=SITE.privacy||''; $('privModal').classList.add('show'); $('privOverlay').classList.add('show'); }
function hidePrivacy(){ $('privModal').classList.remove('show'); $('privOverlay').classList.remove('show'); }

render();
</script>
</body>
</html>
